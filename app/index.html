<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Cadet Pinball</title>
  <!--
    ⚠️ THE MENUS' FACE. The Dev: "Menus devem usar a mesma identidade visual que o game-platformer."
    Atkinson Hyperlegible is what that project calls "PADRÃO (UI/leitura)". It does NOT replace the
    wordmark's Press Start 2P, which is bundled and loaded by `shell/title-dom` and which he asked for
    by name: the logo keeps the pixel face and everything a player reads is set in this one.

    PRELOADED because it is on the first screen the player sees. `font-display: swap` means the title
    paints in the fallback and reflows when the face arrives, which on the title screen is the one place
    a reflow is most visible; the preload makes that window as short as the network allows.
  -->
  <link rel="preload" href="/vendor/fonts/atkinson-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/fonts.css">
</head>
<body>
  <!--
    ⚠️ THE STRIP ABOVE THE GAME, AND `#title-icons` IS THE ENGINE'S HALF OF IT.
    Engine 8 mounts the accessibility bar of the FIRST SCREEN itself — measured in a real browser, it
    puts up blind mode, the screen reader, Libras, the autism adjustments and latching, plus three marked
    "em construção" — and it looks for this id (or for a declared `host.a11yBarHost`). Not finding it,
    `createGame` reports a line saying the child cannot reach any of them before the game starts. The
    engine measured five of its six games missing that bar entirely.

    It is HTML rather than a `createElement` in `main.ts` because the engine wants it at BOOT, and the
    boot runs long before the strip used to be built. The game's own two buttons — the sonar sweep and
    the table palette, which the engine has no counterpart for — are appended beside it.
  -->
  <header class="pinball-topbar">
    <div id="title-icons"></div>
  </header>

  <!-- #game-region: the engine binds the keyboard HERE, never to `window`. The id is not decorative. -->
  <main id="game-region" tabindex="-1"></main>
  <div id="sr-status" role="status" aria-live="polite"></div>
  <div id="sr-alert" role="alert" aria-live="assertive"></div>
  <!--
    #cvd-filters: the engine mounts its six colour-vision filters INTO this element at runtime. It is
    empty on purpose and it is not decorative — without it `createGame` reports "sem host de filtros"
    and the visual menu loses half of what it offers. Found by booting, not by reading.
  -->
  <svg id="cvd-filters" width="0" height="0" aria-hidden="true" focusable="false"></svg>
  <!--
    ⚠️ THE SHELL, NOT THE GAME. ADR-0139: a cartridge is loaded BY a host, and this page's host is
    `standalone.ts` — it registers the dictionaries, settles the language, and only then imports the
    cartridge. Pointing this back at `main.ts` would run the game before a word of that was done.
  -->
  <script type="module" src="./js/standalone.ts"></script>
</body>
</html>
