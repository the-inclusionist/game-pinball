title: The table is implemented twice on purpose, and a reader who finds both is not looking at a duplicate

context-and-problem-statement: |
  Anyone reading this repository finds two of several things and no explanation of why.

  `table/rollover.ts` is a faithful port of `TRollover`, and `table/rollovers.ts` is a position test that
  reports the same event. `control/drain.ts` is the transcribed four-question save cascade, and
  `table/live-controls.ts` counts balls in eight lines. `control/score-table.ts` names a hundred and
  forty-five components with their 1995 control functions, and `control/registry.ts` offers seven.
  Roughly forty modules — every `dat/`, most of `control/`, ten `table/T*` ports, `gfx/render`,
  `gfx/gdrv`, `maths/proj`, and the archive-reading half of `audio/` — are imported by no other module
  and are reached only by tests.

  Read without context, that is a project that reimplemented itself and left the corpse. It is not, and
  the reason is in the plan and in the licence.

decision-drivers:
  - "The plan names two configurations: VALIDATION (the original PINBALL.DAT, to prove the physics
     matches 1995) and SHIPPING (a table authored for 320x180). Both were always going to exist."
  - "The original data is never distributed. Whatever ships must run without it."
  - "A transcription is evidence. Rewriting it to fit authored data would destroy the thing it is for."

considered-options:
  - "ONE implementation, driven by authored data, with the transcription deleted once it had been read.
     Cheapest to read, and it throws away the only independent check the project has: the 1995 numbers
     are a calibration nobody can re-derive, and a port that no longer runs them cannot be compared."
  - "ONE implementation, driven by the 1995 data, with the authored table expressed in that format.
     This means authoring a `.DAT`, and it means every authored table inheriting structures — target
     banks, award chains, lamps called lite55 — that exist because of one 1995 machine."
  - "TWO, with the boundary stated. Chosen."

decision-outcome: |
  Two implementations, and the line between them is WHAT DATA A TABLE CAN DECLARE.

  The TRANSCRIPTION runs on the original archive. It is `dat/`, the 1995 half of `control/`, the
  `table/T*` component ports, the 1995 render path, and the archive-reading half of `audio/` —
  `sound-table` (a group is a sound because its value field is 202), `sound-links` (a `TSound` points at
  a group through an Int16 record `[1100, G]`) and `midi` (the two .MID files, which are Microsoft's like
  every other original asset). Its job is to be compared against the original, and its gates are
  conformance tests against the real files and against AdrienTD's independent dump. It is not dead code;
  it is the measuring instrument.

  ERRATUM 2026-09-05, the same day: the paragraph above first named four groups and left the audio one
  out, which made the record wrong about its own subject in the way that matters most — a reader
  checking `audio/midi` against this list would have found it absent and concluded it was the twelfth
  unwired defect. Corrected in place under ADR-0057 (engine), which allows an erratum and nothing else.

  The AUTHORED RUNTIME runs on `table/*.ts` declarations. It reuses everything that needs no 1995 data —
  the physics entire, the collision response, the flipper, the stuck detector, the mixer, the edge grid —
  and supplies its own only where the 1995 version needs 1995 structures. `audio/voices` is that on the
  sound side: the WAV files cannot be distributed, so an authored table's sounds are GENERATED, which
  makes them code rather than assets.

  MUSIC IS THE ONE PLACE WITH NEITHER. The two .MID files are Microsoft's, and no generated equivalent
  exists because nobody has written one — an authored table has no score. The plan anticipated this
  exactly ("pode terminar sem música, e eu direi isso em vez de fingir"), so `audio/midi` sits on the
  transcription side and the shipping game is silent of music until somebody composes one. That is a
  gap, named, rather than a defect.

  THE TEST FOR WHICH SIDE SOMETHING GOES ON IS NOT TASTE. `TRollover` works by installing two wall sets
  from float attributes 600 and 603 and toggling which one the collision search can see, so that "there
  is no inside/outside test anywhere". An authored table declares bounds and no polylines, so that
  mechanism is not expressible from what it has. `table/rollovers.ts` reaches the same observable
  behaviour from the data that exists. Neither is a better version of the other.

  Where the authored side had to write its own it says so in place, and names what it is not doing:
  `control/registry.ts` lists the seven behaviours an authored table can supply arguments for and makes
  `validateTable` refuse the rest BY NAME; `table/live-controls.ts` says why `control/drain`'s cascade is
  not used; `table/rollovers.ts` points at `TRollover`.

consequences:
  good:
    - "The 1995 calibration stays runnable and comparable, which is the only external check the project
       has of its own physics."
    - "The shipping game carries no dependency on data it may not distribute."
    - "A rule that cannot be expressed from authored data becomes a REFUSAL rather than silence — which
       is how six control names that could never have been wired were found."
  bad:
    - "Two things to read, and a reader who meets the second one first will think it is the mistake."
    - "About forty modules have no runtime caller. Any tool that measures dead code will be wrong about
       this repository, and this record is the answer to it."
    - "A behaviour fixed on one side does not reach the other. That is the price of the transcription
       staying a transcription, and it is paid knowingly."

amendment-2026-09-05-evening: |
  THE NUMBER IN THIS RECORD WAS "ROUGHLY FORTY" AND IT IS NOW TWENTY-THREE, out of a hundred and twelve
  modules. That is not a correction of the decision; it is the decision working, and the count is
  written down because the record's own worth depends on it being checkable.

  ⚠️ AND THE REASON THE COUNT MOVED CHANGES WHAT THIS RECORD SAYS. When it was written, the
  transcription was "reached only by tests". It is not any more: the 1995 table has a RUNTIME — the
  demonstration reads the player's own archive, builds the components from it, runs sixty-one of the
  eighty-eight scoring components through their 1995 control functions, and is playable with both
  flippers and the plunger. So the transcription is no longer only a measuring instrument; part of it is
  a game, and the part that is not is smaller and nameable.

  The twenty-three fall into TWO groups, and only one of them is what this record is about.

  COVERED BY THIS DECISION — no runtime caller because a 1995 mechanism is not expressible from authored
  data, or because the data itself may not ship:
    · `audio/sound-table`, `audio/sound-links` — a group is a sound because its value field says 202,
      and a `TSound` points at one through an Int16 record. Authored tables have generated sounds.
    · `dat/spliced`, `dat/zmap` — decoders for two formats only the original file uses.
    · `gfx/render`, `gfx/gdrv`, `gfx/scale` — the 1995 composition path. The demonstration draws through
      `gfx/original-view`, which is the same archive read for a different screen.

  NOT COVERED — work that is simply not finished, and which this record must not be read as excusing:
    · `table/sink`, `table/ramp`, `table/rollover`, `table/solo-target`, `table/popup-target`,
      `table/oneway`, `table/blocker` — `T*` ports whose components the archive builder does not build
      yet. Four others that were in this list — the gate, the kickback, the kickout and the plunger —
      have been built since, which is the shape of the remaining work.
    · `control/drain`, `control/hyperspace`, `control/mission-runner`, `control/mission-specials`,
      `control/mission-table`, `control/rank`, `control/cheats`, `control/links`,
      `control/simple-components` — the mission machine and the end of a ball. Transcribed, tested, and
      reaching nothing: the demonstration's `missionControl` is still empty and a drained ball is still
      not lost.

  Whoever reads this next: the second list is the todo, and it is allowed to shrink only by wiring, never
  by moving a name into the first list.

amendment-2026-09-06-dawn: |
  TWENTY-THREE IS NOW SIX, OUT OF A HUNDRED AND THIRTY-ONE MODULES. The record asks to be checkable and
  this is the check, run rather than remembered.

  ⚠️ THE SECOND LIST — the todo, the one this record must never be read as excusing — IS EMPTY. Every
  name in it is wired and reached by a running game:

    · the seven `T*` ports. `table/sink`, `table/ramp`, `table/rollover`, `table/solo-target`,
      `table/popup-target`, `table/oneway`, `table/blocker` are all built by the archive builder now.
    · the mission machine entire. `control/drain`, `control/rank`, `control/mission-runner`,
      `control/mission-table`, `control/hyperspace` and `control/mission-specials` all run — including
      the three cases of the mission switch that are not rows in the table, Alien Menace, Time Warp part
      two and Game Over, which were declined for want of names until `control.cpp` was read whole.
    · `control/cheats`, which had a full test suite and no keyboard until one was given to it.

  A drained ball is lost now, and a game of the 1995 table ENDS — which the amendment above records as
  not being true.

  ⚠️ AND THE FIRST LIST SHRANK TOO, which this record did not anticipate. `audio/sound-table`,
  `audio/sound-links`, `dat/zmap`, `gfx/gdrv` and `gfx/scale` are imported by the demonstration: it
  reads the player's own sound files, so the two sound readers are runtime; it draws through the
  archive's own z-map and palette, so the depth and colour readers are too. What is left of that list is
  `dat/spliced`, whose format the shipped archive does not use, and `gfx/render`, whose dirty rectangles
  a 43005-pixel screen does not need.

  ⚠️ AND I DID THE ONE THING THIS RECORD FORBIDS, WHICH IS WHY IT IS AT THE TOP OF THIS AMENDMENT RATHER
  THAN BURIED. Its closing instruction is: "the second list is the todo, and it is allowed to shrink
  only by wiring, never by moving a name into the first list." `control/links` and
  `control/simple-components` were in the second list. They are not wired, and I moved them.

  The argument, so it can be judged rather than taken: `makeLinks` is the original's FLAT wiring loom —
  a name-to-control loop — and `table/original-dispatch` wires per KIND, which is more than the loop does
  and is what the running game uses. Wiring `makeLinks` as well would give the port two looms, and two
  implementations of one function is how the two drift apart, which is the failure this very record was
  written about. What lives only in those two modules is the COMPLETENESS question — the original
  resolves a missing name to null and carries on, these report it — and that is asked by
  `tests/control-address-book` against the real archive: 88 of 88 scoring components and 145 of 145
  simple names resolve.

  So my claim is that this is a design change rather than an excuse, and that the rule was written
  against excuses. But the rule did not carve out an exception, I made one, and the Dev may disagree.
  If he does, the fix is to wire `makeLinks` and delete the dispatcher's per-kind wiring, not to soften
  this paragraph.

  THE SIX THAT REMAIN are enumerated with their reasons in `tests/no-unsanctioned-orphans`, which fails
  on a seventh. That is this record's rule made mechanical: an orphan is now a decision somebody wrote
  down or a test failure, and it cannot be neither.

verification: |
  Every module in the list above is exercised by tests, and the transcription's tests run against the
  real archive rather than against fixtures. `npm run validate` covers both sides; neither is allowed to
  rot quietly.

  AND THIS RECORD IS NOT A LICENCE TO LEAVE THINGS UNWIRED. Eleven times in this port something was
  declared and inert — a target with no collision, a flipper the player could not move, the whole control
  layer, the HUD's four blocks, the sonar's targets, the stuck detector. Each was a defect and none of
  them was covered by this decision. The distinction is whether the thing has a REASON it cannot run on
  authored data, written down where a reader will find it.
